[project]
name = "queryguard-ai"
version = "1.0.0"
description = "Guarded PostgreSQL analytics with a clearly simulated template demo and optional Ollama"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 2

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E402"]
