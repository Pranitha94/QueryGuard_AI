name: QueryGuard verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_DB: queryguard
          POSTGRES_USER: qg_admin
          # Ephemeral CI-only credentials, never used outside this service.
          POSTGRES_PASSWORD: ci_admin_ephemeral_only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U qg_admin -d queryguard"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QG_ADMIN_DSN: postgresql://qg_admin:ci_admin_ephemeral_only@127.0.0.1:55432/queryguard
      QG_READER_PASSWORD: ci_reader_ephemeral_only
      QG_DATABASE_DSN: postgresql://qg_reader:ci_reader_ephemeral_only@127.0.0.1:55432/queryguard
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/bootstrap.py
      - run: python -m ruff check queryguard scripts tests workspace.py
      - run: python -m ruff format --check queryguard scripts tests workspace.py
      - run: python -m compileall -q queryguard scripts workspace.py
      - run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queryguard-executed-evidence
          path: artifacts/
